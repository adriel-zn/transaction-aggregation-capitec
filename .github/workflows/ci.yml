name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore TransactionAggregation.sln
      - run: dotnet build TransactionAggregation.sln --configuration Release --no-restore
      - run: dotnet test TransactionAggregation.sln --configuration Release --no-build
      - run: docker build -t transaction-aggregation-api .
